name: Update Watchlist PER

on:
  schedule:
    # 平日（月〜金）の日本時間 12:00（UTC 03:00）前場終了後
    - cron: '0 3 * * 1-5'
    # 平日（月〜金）の日本時間 16:00（UTC 07:00）大引け後
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # GitHubの画面から手動実行も可能にする

jobs:
  update-per:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの書き込み（コミット）権限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Run PER Update Script
        run: python scripts/update_per.py

      - name: Commit and Push changes
        run: |
          # 差分があるか確認
          if [[ -n $(git status --porcelain watchlist/data/watchlist.json) ]]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add watchlist/data/watchlist.json
            now=$(TZ="Asia/Tokyo" date "+%Y-%m-%d %H:%M:%S")
            git commit -m "auto: yfinanceからPERを一括更新 ($now 成功)"
            git push
            echo "Successfully committed and pushed new PER data."
          else
            echo "No changes in PER data to commit."
          fi
